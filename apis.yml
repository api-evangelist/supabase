apis:
- aid: supabase:realtime-api
  name: Supabase Realtime API
  description: >-
    The Supabase Realtime API provides WebSocket-based subscriptions for real-time data changes from PostgreSQL
    databases. It supports three channel types: database change events (INSERT/UPDATE/DELETE on tables
    via logical replication), presence (track and synchronize connected users' state), and broadcast (low-latency
    message passing between clients). Authentication uses JWT tokens. Implemented using the Phoenix channels
    protocol.
  humanURL: https://supabase.com/docs/guides/realtime
  tags:
  - Real-Time
  - WebSocket
  - Database
  - Presence
  - Broadcast
  tags_raw:
  - Realtime
  - WebSocket
